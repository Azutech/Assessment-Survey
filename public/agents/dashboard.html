<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Agent Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
    }

    .logout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    .cards {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .profile-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .profile-item {
      margin-bottom: 10px;
      color: #4b5563;
    }

    .stat-number {
      font-size: 40px;
      font-weight: bold;
      margin-top: 12px;
    }

    .actions {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
    }

    .btn {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #111827;
      color: white;
    }

    .btn-secondary {
      background: white;
      border: 1px solid #d1d5db;
    }

    .table-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .table-header input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      width: 250px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f9fafb;
      text-align: left;
      padding: 14px;
      font-size: 13px;
    }

    td {
      padding: 14px;
      border-top: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .status {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .verified {
      background: #dcfce7;
      color: #166534;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .unverified {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    @media(max-width: 900px) {
      .cards {
        grid-template-columns: 1fr;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>

</head>
<body>

<div class="container">

  <div class="header">
    <h1>Agent Dashboard</h1>


<button class="logout-btn" onclick="logout()">
  Logout
</button>


  </div>

  <div class="cards">


<div class="card">
  <div id="agentName" class="profile-name">
    Loading...
  </div>

  <div class="profile-item">
    <strong>Unique ID:</strong>
    <span id="uniqueId">-</span>
  </div>

  <div class="profile-item">
    <strong>Email:</strong>
    <span id="email">-</span>
  </div>

  <div class="profile-item">
    <strong>Status:</strong>
    <span id="status">-</span>
  </div>

  <div class="profile-item">
    <strong>Last Active:</strong>
    <span id="lastActive">-</span>
  </div>

  <div class="profile-item">
    <strong>Last Location:</strong>
    <span id="lastLocation">-</span>
  </div>
</div>

<div class="card">
  <div>Total Responses</div>

  <div
    id="totalResponses"
    class="stat-number"
  >
    0
  </div>
</div>


  </div>

  <div class="actions">
 <button
    class="btn btn-primary"
    onclick="window.location.href='/agents/survey.html'"
>

    + Add Survey

</button>



<button
  class="btn btn-secondary"
  onclick="loadSurveys()"
>
  Refresh
</button>


  </div>

  <div class="table-card">


<div class="table-header">
  <h2>My Surveys</h2>

  <input
    type="text"
    id="search"
    placeholder="Search customer..."
  />
</div>

<table>

  <thead>
    <tr>
      <th>Customer</th>
      <th>Phone</th>
      <th>Market</th>
      <th>Business Type</th>
      <th>Status</th>
      <th>Date</th>
    </tr>
  </thead>

  <tbody id="surveyTableBody">
    <tr>
      <td colspan="6" class="loading">
        Loading surveys...
      </td>
    </tr>
  </tbody>

</table>


  </div>

</div>

<script>

const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if (!token || role !== "agent") {
  window.location.href = "/login.html";
}

async function loadAgent() {
  try {
    console.log("TOKEN", token);

    const response = await fetch(
      "/api/v1/agents/agentDashboard",
      {
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    const result = await response.json();

    const agent = result.agent;

    document.getElementById("agentName").textContent =
      agent.fullName;

    document.getElementById("uniqueId").textContent =
      agent.uniqueId;

    document.getElementById("email").textContent =
      agent.email;

    document.getElementById("status").textContent =
      agent.status;

    document.getElementById("totalResponses").textContent =
      agent.totalResponse;

    document.getElementById("lastLocation").textContent =
      agent.lastLocation || "-";

    document.getElementById("lastActive").textContent =
      new Date(agent.lastActiveTime).toLocaleString();

  } catch (error) {
    console.error("LOAD AGENT ERROR", error);
  }
}

async function loadSurveys(search = "") {

  try {

    const response = await fetch(
      `/api/v1/surveys/viewAllCustomersAgents?page=1&limit=20&search=${encodeURIComponent(search)}`,
      {
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    const result = await response.json();

    const surveys =
      result.customers?.data ||
      result.data ||
      [];

    const tbody =
      document.getElementById(
        "surveyTableBody"
      );

    tbody.innerHTML = "";

    if (!surveys.length) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6">
            No surveys found
          </td>
        </tr>
      `;
      return;
    }

    surveys.forEach((survey) => {

      tbody.innerHTML += `
        <tr>

          <td>
            ${survey.customerName || "-"}
          </td>

          <td>
            ${survey.phoneNumber || "-"}
          </td>

          <td>
            ${survey.marketName || "-"}
          </td>

          <td>
            ${survey.businessType || "-"}
          </td>

          <td>
            <span class="status ${survey.status || 'pending'}">
              ${survey.status || 'pending'}
            </span>
          </td>

          <td>
            ${new Date(
              survey.createdAt
            ).toLocaleDateString()}
          </td>

        </tr>
      `;
    });

  } catch (error) {
    console.error(error);
  }
}

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("user");

  window.location.href = "/login.html";
}

document
  .getElementById("search")
  .addEventListener(
    "input",
    (e) => {
      loadSurveys(e.target.value);
    }
  );

loadAgent();
loadSurveys();

</script>

</body>
</html>
