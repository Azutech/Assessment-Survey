<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Market Shop Survey - Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 24px;
      color: #111827;
      margin-bottom: 6px;
    }

    .logo p {
      color: #6b7280;
      font-size: 14px;
    }

    .role-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .role-option {
      flex: 1;
      padding: 12px;
      text-align: center;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
      font-weight: 600;
    }

    .role-option.active {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #111827;
    }

    .error-message {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .error-message.show {
      display: block;
    }

    .login-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #111827;
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
    }

    .login-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      margin: auto;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">
      <h1>Market Shop Survey</h1>
      <p>Sign in to continue</p>
    </div>

    <div class="role-selector">
      <div class="role-option active" data-role="agent">
        Agent
      </div>

      <div class="role-option" data-role="admin">
        Admin
      </div>
    </div>

    <div id="error-message" class="error-message"></div>

    <div class="form-group">
      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="example@email.com"
      />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
      />
    </div>

    <button
      id="login-btn"
      class="login-btn"
      onclick="login()"
    >
      <span id="btn-text">Sign In</span>
      <div id="spinner" class="spinner"></div>
    </button>

    <div class="footer">
      Market Shop Survey System
    </div>

  </div>

  <script>
    const API_URL = "/api/v1";

    let selectedRole = "agent";

    const roleButtons =
      document.querySelectorAll(".role-option");

    roleButtons.forEach((button) => {
      button.addEventListener("click", () => {
        roleButtons.forEach(btn =>
          btn.classList.remove("active")
        );

        button.classList.add("active");

        selectedRole = button.dataset.role;
      });
    });

    // Auto Login Redirect
    (() => {
      const token = localStorage.getItem("token");
      const role = localStorage.getItem("role");

      if (!token || !role) return;

      if (role === "agent") {
        window.location.href = "/agents/dashboard.html";
      }

      if (role === "admin") {
        window.location.href = "/admin/dashboard.html";
      }
    })();

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        login();
      }
    });

    async function login() {
      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const errorBox =
        document.getElementById("error-message");

      const loginBtn =
        document.getElementById("login-btn");

      const btnText =
        document.getElementById("btn-text");

      const spinner =
        document.getElementById("spinner");

      errorBox.classList.remove("show");

      if (!email || !password) {
        errorBox.textContent =
          "Email and password are required.";
        errorBox.classList.add("show");
        return;
      }

      const endpoint =
        selectedRole === "agent"
          ? `${API_URL}/agents/login`
          : `${API_URL}/admin/login`;

      try {
        loginBtn.disabled = true;
        btnText.style.display = "none";
        spinner.style.display = "block";

        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message ||
            result.msg ||
            "Login failed"
          );
        }

        const user =
          selectedRole === "agent"
            ? result.agent
            : result.admin;

        const token = user?.auth;

        if (!token) {
          throw new Error(
            "Authentication token not found."
          );
        }

        localStorage.setItem("token", token);
        localStorage.setItem("role", selectedRole);
        localStorage.setItem(
          "user",
          JSON.stringify(user)
        );

        if (selectedRole === "agent") {
          window.location.href =
            "/agents/dashboard.html";
        } else {
          window.location.href =
            "/admin/dashboard.html";
        }

      } catch (error) {
        errorBox.textContent =
          error.message ||
          "Unable to login.";

        errorBox.classList.add("show");
      } finally {
        loginBtn.disabled = false;
        btnText.style.display = "block";
        spinner.style.display = "none";
      }
    }
  </script>

</body>
</html>
